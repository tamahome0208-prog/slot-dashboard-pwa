<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#1a1a2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5e9f"/>
      <stop offset="100%" stop-color="#40e8ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>

  <!-- グリッド線 -->
  <g stroke="#40e8ff" stroke-width="0.5" opacity="0.15">
    <line x1="0" y1="48" x2="192" y2="48"/>
    <line x1="0" y1="96" x2="192" y2="96"/>
    <line x1="0" y1="144" x2="192" y2="144"/>
    <line x1="48" y1="0" x2="48" y2="192"/>
    <line x1="96" y1="0" x2="96" y2="192"/>
    <line x1="144" y1="0" x2="144" y2="192"/>
  </g>

  <!-- 四隅 -->
  <g stroke="#40e8ff" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 16 30 L 16 16 L 30 16"/>
    <path d="M 162 16 L 176 16 L 176 30"/>
    <path d="M 16 162 L 16 176 L 30 176"/>
    <path d="M 176 162 L 176 176 L 162 176"/>
  </g>

  <!-- スロットアイコン（リール3つ） -->
  <g filter="url(#glow)">
    <rect x="32" y="64" width="32" height="64" rx="4" fill="#1a1a2a" stroke="#ff5e9f" stroke-width="2"/>
    <rect x="80" y="64" width="32" height="64" rx="4" fill="#1a1a2a" stroke="#40e8ff" stroke-width="2"/>
    <rect x="128" y="64" width="32" height="64" rx="4" fill="#1a1a2a" stroke="#ffe066" stroke-width="2"/>

    <text x="48" y="106" font-family="Orbitron, monospace" font-size="32" font-weight="900" fill="#ff5e9f" text-anchor="middle">7</text>
    <text x="96" y="106" font-family="Orbitron, monospace" font-size="32" font-weight="900" fill="#40e8ff" text-anchor="middle">7</text>
    <text x="144" y="106" font-family="Orbitron, monospace" font-size="32" font-weight="900" fill="#ffe066" text-anchor="middle">7</text>
  </g>

  <!-- 下部テキスト -->
  <text x="96" y="156" font-family="Orbitron, monospace" font-size="14" font-weight="700" fill="url(#accent)" text-anchor="middle" letter-spacing="2">SLOT</text>
</svg>
