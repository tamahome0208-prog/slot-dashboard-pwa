name: GitHub Pagesへ自動デプロイ

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'README.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Pagesセットアップ
        uses: actions/configure-pages@v5

      - name: アーティファクトアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: GitHub Pagesにデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
