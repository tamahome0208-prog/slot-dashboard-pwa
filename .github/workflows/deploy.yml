name: Netlifyへ自動デプロイ

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'README.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Netlify CLIインストール
        run: npm install -g netlify-cli@latest

      - name: 本番デプロイ
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy --prod --dir=. \
            --message "Auto deploy: ${{ github.event.head_commit.message }}"
