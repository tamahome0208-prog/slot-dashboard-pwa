name: 台データ自動収集

on:
  schedule:
    # 毎日 朝7時（JST）= UTC 22:00 前日
    - cron: '0 22 * * *'
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: スクレイピング実行
        run: python scripts/scrape.py

      - name: ロイヤル登別 履歴追記
        run: python scripts/royal_daily.py
        continue-on-error: false

      - name: 変更をコミット
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            LATEST=$(python -c "import json; h=json.load(open('data/royal_history.json',encoding='utf-8')); h.sort(key=lambda x:int(x.get('id','0') or 0),reverse=True); print(f\"{len(h)}日, 最新{h[0].get('date_str','?')}\")" 2>/dev/null || echo "")
            git commit -m "🤖 台データ自動更新 $(date +'%Y-%m-%d') ($LATEST)"
            # push競合対策: pull --rebase + retry 最大3回
            for i in 1 2 3; do
              if git pull --rebase --autostash origin main && git push; then
                echo "Push成功 (attempt $i)"
                break
              else
                echo "Push失敗 (attempt $i)、5秒後にretry..."
                sleep 5
              fi
            done
          fi
