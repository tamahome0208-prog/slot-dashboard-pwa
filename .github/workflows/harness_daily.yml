name: ハーネス日次チェック

on:
  schedule:
    # 毎日 朝7:23(JST) = UTC 22:23 前日
    - cron: '23 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 日次チェック実行
        run: python harness/scripts/daily_check.py

      - name: 変更コミット
        run: |
          git config --local user.email "harness@github.com"
          git config --local user.name "Harness Bot"
          git add harness/state/
          if git diff --staged --quiet; then
            echo "状態変更なし"
          else
            git commit -m "🤖 ハーネス日次チェック $(date +'%Y-%m-%d')"
            git push
          fi
